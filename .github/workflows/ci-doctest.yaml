# Documentation testing workflow.
# Runs doctests on the code examples of the docstrings and of the Markdown files to ensure they
# work correctly.

name: Doctest
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Run doctests embedded in the source code docstrings and in the Markdown files
  doctest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2

      # Run doctest to validate the code examples
      - name: Run doctest
        run: |
          inv test.doctest
