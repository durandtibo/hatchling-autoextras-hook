# Documentation testing workflow.
# Runs doctests on code examples in docstrings to ensure they work correctly.

name: Doctest
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Run doctests embedded in source code docstrings
  doctest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      # Run doctest to validate code examples in docstrings
      - name: Run doctest on source code
        run: |
          inv test.doctest-src
