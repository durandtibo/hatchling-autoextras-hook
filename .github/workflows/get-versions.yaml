name: Get Versions
on:
  workflow_call:
    outputs:
      package_versions:
        description: "JSON string containing all package versions"
        value: ${{ jobs.get-versions.outputs.package_versions }}
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  get-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      package_versions: ${{ steps.generate-output.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read JSON file with package versions
        uses: durandtibo/read-json-action@v0.1
        id: read-json
        with:
          file-path: dev/config/package_versions.json

      - name: Generate versions output
        id: generate-output
        env:
          VERSIONS_JSON: ${{ steps.read-json.outputs.json-content }}
        run: |
          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"

      - name: Show versions
        run: |
          echo "versions: ${{ toJson(fromJson(steps.generate-output.outputs.versions)) }}"
