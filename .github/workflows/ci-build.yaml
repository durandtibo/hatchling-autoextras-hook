# Build and package validation workflow.
# Tests that the package can be built correctly as both source distribution and wheel.
# Validates package metadata, dependencies, and that the package works on every
# supported Python version.

name: Build Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Read the package name from pyproject.toml.
  get-metadata:
    uses: ./.github/workflows/lib-get-package-metadata.yaml

  # Test the build on every supported Python version, including free-threaded
  # builds (e.g. 3.13t/3.14t), to catch version-specific build regressions.
  build:
    needs: get-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # ratchet:astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: ${{ needs.get-metadata.outputs.name }}
          package-dependencies: hatchling
          dist-type: ${{ matrix.dist-type }}
      - name: Run package checks
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py
          echo "✅ Package checks passed"
