name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Get the version bounds of the dependencies from dev/config/package_versions.json,
  # kept up to date by bot-generate-package-versions.yaml.
  get-versions:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-versions.yaml
  # Load the shared python-version/OS matrix from the default config of
  # durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install hatchling-autoextras-hook"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "hatchling-autoextras-hook[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre hatchling-autoextras-hook"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "hatchling-autoextras-hook[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  ##########################
  #     Dependencies     #
  ##########################

  hatchling:
    permissions:
      contents: read
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: hatchling
      install-cmd: "uv pip install hatchling-autoextras-hook"
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).hatchling) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
